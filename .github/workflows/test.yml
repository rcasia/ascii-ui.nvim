name: CI

on:
  schedule:
    - cron: "00 00 * * 4" # every friday at 00:00
  pull_request:
    branches: ["main"]
    paths:
      - "lua/**"
      - "tests/**"
      - "scripts/**"
      - "*.lua"
      - "Makefile"
      - "lux.toml"
      - ".github/workflows/test.yml"
  workflow_call:

jobs:
  test:
    name: Neovim ${{ matrix.nvim-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nvim-version: [stable, v0.11.7, nightly]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: Install Lux
        uses: lumen-oss/gh-actions-lux@v1
        with:
          version: "0.40.3"

      - name: Run tests
        run: lx test
        timeout-minutes: 3
