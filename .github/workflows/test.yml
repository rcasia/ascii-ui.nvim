name: CI

on:
  schedule:
    - cron: "00 00 * * 4" # every friday at 00:00
  pull_request:
    branches: ["main"]
    paths:
      - "lua/**"
      - "tests/**"
      - "scripts/**"
      - "*.lua"
      - "Makefile"
      - "lux.toml"
      - ".github/workflows/test.yml"
  workflow_call:

jobs:
  test:
    name: ${{ matrix.job.target }} - Neovim ${{ matrix.nvim-version }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-24.04, target: x86_64-linux }
          - { os: ubuntu-24.04-arm, target: aarch64-linux }
          - { os: macos-14, target: aarch64-darwin }
          - { os: windows-2025, target: x86_64-windows-msvc }
        nvim-version: [stable, nightly]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install MSVC Compiler Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        if: endsWith(matrix.job.target, '-msvc')

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: Install Lux
        uses: lumen-oss/gh-actions-lux@v1
        with:
          version: "0.40.3"

      - name: Run tests
        run: lx test
        timeout-minutes: 3
